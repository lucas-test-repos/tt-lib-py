[project]
name = "tt-lib-py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "aiokafka>=0.11",
    "aio-pika>=9.4",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
# pytest-asyncio hace falta para las corrutinas de test de tt_lib.events: sin
# él pytest recolecta los tests async pero no los ejecuta.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
